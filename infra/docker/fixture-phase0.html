<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Session Lab Fixture</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2d;color:#e3edfa;font:15px system-ui}header{padding:16px 22px;background:#172943;display:flex;justify-content:space-between}main{padding:20px}h1{font-size:22px;margin:0 0 12px}p{color:#a7bad0}input,button{font:inherit;padding:9px 12px;border-radius:6px;border:1px solid #48617e;margin:4px;background:#1c3550;color:#edf6ff}button{background:#237e6b;cursor:pointer}label{display:block;margin:8px 0}input{background:#122337}section{border:1px solid #314961;border-radius:10px;padding:16px;margin:12px 0}.hidden{display:none}.stats{display:flex;gap:18px}.stat{background:#19334c;padding:12px;border-radius:8px}canvas{display:block;background:#0d1623;border:1px solid #48617e;border-radius:8px;max-width:100%;margin-top:10px}output{color:#8ce7c2}#login{max-width:450px}#result{margin-top:12px}a{color:#8cdcd0}</style></head><body>
<header><strong>Session Lab · Site de teste</strong><span id="origin"></span></header><main>
<section id="login"><h1>Entrar na conta de teste</h1><p>Usuário: demo-qualquer-nome · Senha: phase0-demo</p><form data-testid="login-form"><label>Usuário<input data-testid="username" name="username" autocomplete="off" required></label><label>Senha<input data-testid="password" name="password" type="password" autocomplete="off" required></label><button data-testid="login" type="submit">Entrar</button><output data-testid="login-error"></output></form></section>
<section id="app" class="hidden"><h1 data-testid="identity"></h1><div class="stats"><div class="stat">Curas <b data-testid="heals">0</b></div><div class="stat">Visitas <b data-testid="visits">0</b></div><div class="stat">Canvas <b data-testid="canvas-count">0</b></div></div><p><button data-testid="heal">Curar equipe</button><button data-testid="shop">Visitar loja</button><button data-testid="reject">Rejeitar ação</button></p><label>Observação / teste de IME<input data-testid="note" autocomplete="off"></label><button data-testid="save-note">Salvar observação</button><output data-testid="saved-note"></output><div id="result" data-testid="result">Pronto</div><label>Complexidade do canvas <input data-testid="load" type="range" min="20" max="1600" value="120"></label><canvas data-testid="canvas" width="640" height="130"></canvas><span data-testid="canvas-ready"></span></section></main>
<script>
document.querySelector('#origin').textContent=location.hostname;let current;let busy=false;
const $=s=>document.querySelector('[data-testid="'+s+'"]');
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const value=await res.json();if(!res.ok)throw Error(value.error);return value;}
function render(value){current=value;document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');$('identity').textContent=value.username;$('heals').textContent=value.heals;$('visits').textContent=value.visits;$('canvas-count').textContent=value.canvasClicks;$('saved-note').textContent=value.note;}
async function marker(username){localStorage.setItem('fixture-user',username);sessionStorage.setItem('fixture-tab',username);await new Promise((resolve,reject)=>{const req=indexedDB.open('msm-fixture',1);req.onupgradeneeded=()=>req.result.createObjectStore('markers');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result;const tx=db.transaction('markers','readwrite');tx.objectStore('markers').put(username,'user');tx.oncomplete=()=>{db.close();resolve();};};});}
$('login-form').addEventListener('submit',async event=>{event.preventDefault();try{const value=await api('/api/login',{username:$('username').value,password:$('password').value});await marker(value.username);render(value);$('result').textContent='Login confirmado';}catch{$('login-error').textContent='Login inválido';}});
async function act(action,value){if(busy)return;busy=true;$('result').textContent='Executando';try{render(await api('/api/action',{action,value}));$('result').textContent='OK: '+action;}catch{$('result').textContent='Erro: ação rejeitada';}finally{busy=false;}}
for(const action of ['heal','shop','reject'])$(action).onclick=()=>act(action);
$('save-note').onclick=()=>act('note',$('note').value);$('canvas').onclick=()=>act('canvas');
const ctx=$('canvas').getContext('2d');let frame=0;function animate(){frame++;ctx.fillStyle='#0c1726';ctx.fillRect(0,0,640,130);const count=Number($('load').value);for(let i=0;i<count;i++){ctx.fillStyle=i%2?'#69d8b5':'#508bd6';ctx.fillRect((i*27+frame)%640,(i*13)%124,4,5);}ctx.fillStyle='#e5f8ff';ctx.font='16px system-ui';ctx.fillText('Canvas ativo · '+frame,18,28);$('canvas-ready').textContent=frame>2?'Canvas pronto':'';requestAnimationFrame(animate);}animate();
api('/api/me').then(render).catch(()=>{});
</script></body></html>
