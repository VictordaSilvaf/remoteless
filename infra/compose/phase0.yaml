name: msm-phase0
x-lab-image: &image
  image: msm-phase0:0.1.0
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
    target: runner
x-hardened: &hardened
  <<: *image
  user: "1000:1000"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true, "seccomp=../docker/seccomp.runner.json"]
  network_mode: none
  pids_limit: 384
  mem_limit: 2g
  cpus: 2
  shm_size: 256m
  tmpfs: ["/tmp:rw,nosuid,size=256m,uid=1000,gid=1000"]
  environment:
    XDG_CONFIG_HOME: /tmp/msm-config
    XDG_CACHE_HOME: /tmp/msm-cache

services:
  fixture:
    <<: *image
    command: [infra/docker/fixture-phase0.mjs]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [fixtures]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    <<: *image
    command: [infra/docker/gateway-phase0.mjs]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    volumes: ["proxy:/proxy"]
    networks: [fixtures]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      fixture: {condition: service_healthy}
    healthcheck:
      test: [CMD,node,-e,"require('node:fs').accessSync('/tmp/gateway-ready')"]
      interval: 2s
      timeout: 3s
      retries: 15

  lab:
    <<: *hardened
    command: [apps/session-lab/dist/index.js]
    volumes:
      - proxy:/proxy:ro
      - control:/run/msm/lab
      - sessions:/state
      - ../../.runtime/lab:/run/lab:ro
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD,node,-e,"require('node:fs').accessSync('/tmp/lab-ready')"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "on-failure:3"

  verify:
    <<: *hardened
    profiles: [verify]
    command: [apps/session-lab/dist/verify.js]
    volumes:
      - control:/run/msm/lab:ro
      - ../../.runtime/lab/config.json:/run/lab/config.json:ro
      - ${MSM_LAB_ARTIFACT_DIR:-../../.runtime/artifacts/phase0}:/artifacts
    depends_on:
      lab: {condition: service_healthy}
    restart: "no"

networks:
  fixtures: {internal: true}
volumes:
  proxy:
  sessions:
  control:
    name: ${MSM_LAB_CONTROL_VOLUME:-msm-phase0_control}
    external: true
